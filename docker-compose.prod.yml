# Production stack (DEPLOYMENT.md), for one Linux server with Docker:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# (ENV_FILE=other-file selects another settings file for the api and worker, for rehearsals.)
# Only Caddy (web) is reachable from outside; the database never is. Data lives in named
# volumes (database, uploaded files, backups, certificates), named monposte_* after the
# project name below, wherever the folder is (`-p` overrides it, for rehearsals).

name: monposte

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    # The API applies the database migrations when it starts.
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Audience measurement (GROWTH.md): Umami, in its own database ("umami", created on the
  # same PostgreSQL by umami-db). Its dashboard is https://stats.$DOMAIN; the tracker
  # script and the collection endpoint are served on the site itself, under /u/ (Caddyfile).
  umami-db:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'umami'\" | grep -q 1 || createdb umami"]
    depends_on:
      postgres: { condition: service_healthy }

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET (DEPLOYMENT.md)}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db: { condition: service_completed_successfully }

  # A compressed dump every day at BACKUP_HOUR (UTC), kept BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  backups:
  caddy_data:
  caddy_config:
