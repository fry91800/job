<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API test client</title>
    <style>
      body { font-family: system-ui, sans-serif; font-size: 14px; margin: 0; }
      .layout { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
      main { overflow: auto; padding: 12px 16px; }
      aside { overflow: auto; border-left: 1px solid #ccc; padding: 8px; background: #f6f6f6; font-size: 12px; }
      nav button[aria-current="page"] { font-weight: bold; }
      fieldset { margin: 8px 0; }
      label { margin-right: 10px; }
      table { border-collapse: collapse; width: 100%; }
      td, th { border-bottom: 1px solid #ddd; padding: 4px; text-align: left; vertical-align: top; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
      .error { color: #b00; }
      .muted { color: #777; }
      a { cursor: pointer; color: #0645ad; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
