services:
  postgres:
    image: postgres:17
    container_name: job-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job
      POSTGRES_PASSWORD: job_dev_password
      POSTGRES_DB: job
    ports:
      - "127.0.0.1:5433:5432" # 5433: a local PostgreSQL often already uses 5432
    volumes:
      - job_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job -d job"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development mail server: catches every email the API sends (nothing leaves the machine).
  # Web UI: http://localhost:8026. Host ports 1026/8026 avoid clashing with other MailHogs.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: job-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  # Job collector worker (COLLECTOR.md): scheduled collection, board checks, discovery,
  # expiry. Runs the repository's code (mounted) with its node_modules; restart it after a
  # code change: `docker compose restart collector`. Logs: `docker compose logs -f collector`.
  collector:
    image: node:24.13.0-bookworm-slim
    container_name: job-collector
    restart: unless-stopped
    profiles: ["collector"] # started on demand: npm run collector:up
    working_dir: /app
    command: ["node", "--import", "tsx", "apps/job_collector/src/main.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://job:job_dev_password@postgres:5432/job
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  job_pgdata:
